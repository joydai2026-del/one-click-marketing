# A paid campaign. Every field here changes what is bought, so every field here is inside
# the intent digest that a human approval binds to.
#
# NOTHING IN THIS FILE IS REAL. The landing url is a reserved example domain, the budget is
# illustrative, and the creatives point at fabricated sample files in this repository.
#
# Unknown keys are an ERROR, not a warning. A typo'd key that is silently ignored gives you
# a campaign running with a default nobody chose.

campaign_id = "sample-campaign-01"
objective = "conversions"
optimization_event = "purchase"
landing_url = "https://example.invalid/sample-product"
run_days = 7
geo = ["US"]
languages = ["en"]

# Creatives are identified by WHAT THEY ARE, not by where a platform put them. A ref
# without a content hash would bind to whatever is at that path at read time, which is
# exactly what the approval exists to prevent. Both fields are required.
#
# Relative refs resolve against THIS FILE'S directory, never the process working directory.
[[creatives]]
ref = "../../samples/creatives/sample-creative-a.txt"
content_hash = "a0013f556d12b80f6aa22b4d8e6f3274d39872e75cf351d1d0ed9e3e13d8633e"

[[creatives]]
ref = "../../samples/creatives/sample-creative-b.txt"
content_hash = "fd4c1d38c9c316e71e19c8f71d899e1cdc435bd00114b92b4e6d7b92f9516a83"

[guardrails]
# Money is an INTEGER in minor units (cents). Never a float: float arithmetic on money
# produces a ceiling that is occasionally a hundredth over, and "occasionally over the
# approved amount" is the one thing a spend guard may not be.
#
# LIFETIME, not daily. Ad platforms treat a daily budget as a target they may overshoot,
# so a daily figure is not a cap and must not be presented as one.
lifetime_budget_minor = 25000  # 250.00
currency = "USD"

# The number this round will be judged on, named BEFORE any money moves. Required and
# non-empty. Choosing it afterwards from the results is how every campaign becomes a
# success: there is always some metric that went up.
decision_metric = "cost_per_purchase"

# N campaigns each at the per-campaign cap is N times the exposure, so an account ceiling
# becomes required as soon as this exceeds 1.
max_active_campaigns = 1

# Consecutive unreadable collections before the round stops. A campaign whose results
# cannot be read is a campaign spending blind.
max_collection_failures = 3
